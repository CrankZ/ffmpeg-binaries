name: build-ffmpeg-minimal
run-name: ffmpeg ${{ inputs.ffmpeg_version }} -> ${{ inputs.release_tag }}

# 手动触发：输入 FFmpeg 版本与产物 tag，产出 win-x64 / macos-arm64 / macos-x64 /
# macos-universal 四个最小化静态可执行文件，并发布为 GitHub Release。
#
# 结构（各构建 job 并行，universal/release 依赖前置结果）：
#   validate
#   ├── win-minimal ──┐
#   ├── win-reference ┼── win-compare
#   ├── macos-arm64 ──┬── macos-universal ──┐
#   ├── macos-x64 ────┘                    ├── release
#   ├── macos-reference ── macos-compare ──┘
on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg 版本（如 9.0.2）"
        required: true
        default: "9.0.2"
      ffmpeg_sha256:
        description: "（可选）源码 tar.xz 的 sha256；留空则只记录不校验"
        required: false
        default: ""
      release_tag:
        description: "产物 tag（Release 名）"
        required: true
        default: "ffmpeg-min-9.0.2"
      build_reference:
        description: "额外构建同版本全量版本做 PCM 一致性 / 解码耗时对比"
        type: boolean
        default: true
      publish_release:
        description: "发布 GitHub Release"
        type: boolean
        default: true

# 默认最小权限；只有 release job 需要写
permissions:
  contents: read

concurrency:
  group: ffmpeg-min-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
  FFMPEG_SHA256: ${{ inputs.ffmpeg_sha256 }}
  # 与 muyi 的 .cargo/config.toml（macOS 13.0）保持一致
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  # ccache：CI 里由 actions/cache 提供目录，脚本检测到 CCACHE_DIR 才启用
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "2G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPILERCHECK: "content"
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"

jobs:
  # ===========================================================================
  validate:
    name: 校验输入
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 校验版本 / tag / sha256
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$FFMPEG_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || {
            echo "非法 ffmpeg_version: $FFMPEG_VERSION"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || {
            echo "非法 release_tag: $RELEASE_TAG"; exit 1; }
          if [ -n "$FFMPEG_SHA256" ]; then
            [[ "$FFMPEG_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "非法 ffmpeg_sha256（应为 64 位十六进制）"; exit 1; }
          fi
          echo "输入校验通过: ffmpeg $FFMPEG_VERSION -> $RELEASE_TAG"

  # ===========================================================================
  win-minimal:
    name: Windows x64 minimal (MSYS2 MINGW64)
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 缓存 FFmpeg 源码（key 含版本号）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dl
          key: ffmpeg-src-win-min-${{ inputs.ffmpeg_version }}

      - name: 缓存 ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-win-min-${{ inputs.ffmpeg_version }}-${{ hashFiles('scripts/ffmpeg-minimal/components.sh', 'scripts/ffmpeg-minimal/common.sh') }}
          restore-keys: |
            ccache-win-min-${{ inputs.ffmpeg_version }}-
            ccache-win-

      - name: 准备 MSYS2 (MINGW64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ccache
            make
            pkgconf
            diffutils
            zip

      - name: 构建 minimal（configure + make + strip + 打包）
        shell: msys2 {0}
        env:
          BUILD_TARGET: minimal
        run: bash scripts/ffmpeg-minimal/build-msys2.sh

      - name: 验收（-version / DLL 依赖 / 组件面 / 三种调用 / 体积）
        shell: msys2 {0}
        run: |
          bash scripts/ffmpeg-minimal/verify.sh \
            --binary work/build/win-x64/ffmpeg.exe \
            --platform win-x64

      # 用 cache 而不是 artifact 在 job 间传产物：不受 artifact 配额限制，也省一次压缩上传
      - name: 保存产物到缓存（供 compare / release 使用）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/dist/ffmpeg-win-x64.zip
            work/build/win-x64/ffmpeg.exe
          key: xfer-win-min-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}

  # 全量参考构建单独占一个 runner，和 minimal 并行；产物按版本缓存，重跑可直接复用。
  win-reference:
    name: Windows x64 reference（全量对照，不发布）
    needs: validate
    if: inputs.build_reference == true
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 缓存 FFmpeg 源码
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dl
          key: ffmpeg-src-win-ref-${{ inputs.ffmpeg_version }}

      - name: 缓存参考构建产物（命中则跳过全量编译）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/build/ref-win-x64/ffmpeg.exe
          key: ffmpeg-ref-win-x64-${{ inputs.ffmpeg_version }}-${{ hashFiles('scripts/ffmpeg-minimal/common.sh', '.github/workflows/build-ffmpeg-minimal.yml') }}

      - name: 缓存 ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-win-ref-${{ inputs.ffmpeg_version }}-${{ hashFiles('scripts/ffmpeg-minimal/common.sh') }}
          restore-keys: |
            ccache-win-ref-${{ inputs.ffmpeg_version }}-
            ccache-win-

      - name: 准备 MSYS2 (MINGW64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ccache
            make
            pkgconf
            diffutils
            zip

      - name: 构建参考版（缓存命中则跳过）
        shell: msys2 {0}
        env:
          BUILD_TARGET: reference
          REUSE_REFERENCE: "true"
        run: bash scripts/ffmpeg-minimal/build-msys2.sh

      - name: 确认参考版可运行
        shell: msys2 {0}
        run: work/build/ref-win-x64/ffmpeg.exe -hide_banner -version | head -n 1

      - name: 保存参考产物到缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/build/ref-win-x64/ffmpeg.exe
          key: xfer-win-ref-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}

  win-compare:
    name: Windows PCM 一致性 + 解码耗时对比
    needs: [validate, win-minimal, win-reference]
    if: inputs.build_reference == true
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 恢复 minimal 产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/dist/ffmpeg-win-x64.zip
            work/build/win-x64/ffmpeg.exe
          key: xfer-win-min-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 恢复参考产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/build/ref-win-x64/ffmpeg.exe
          key: xfer-win-ref-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: PCM 一致性 + 解码耗时对比
        shell: bash
        run: |
          bash scripts/ffmpeg-minimal/compare-pcm.sh \
            --minimal   work/build/win-x64/ffmpeg.exe \
            --reference work/build/ref-win-x64/ffmpeg.exe

  # ===========================================================================
  # macOS 用 macos-15 (Apple Silicon) 编 arm64，并在同一镜像上交叉编 x86_64；
  # 两个切片各自一个 runner 并行，universal 只做 lipo。x86_64 切片必须有 nasm，
  # 否则汇编路径被关闭、性能大幅下降（脚本内断言）。
  macos-arm64:
    name: macOS arm64 minimal
    needs: validate
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 缓存 FFmpeg 源码
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dl
          key: ffmpeg-src-macos-arm64-${{ inputs.ffmpeg_version }}

      - name: 缓存 ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ inputs.ffmpeg_version }}-${{ hashFiles('scripts/ffmpeg-minimal/components.sh', 'scripts/ffmpeg-minimal/common.sh') }}
          restore-keys: |
            ccache-macos-arm64-${{ inputs.ffmpeg_version }}-
            ccache-macos-

      - name: 安装 nasm / ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install nasm ccache

      - name: 构建 arm64
        env:
          BUILD_TARGET: arm64
        run: bash scripts/ffmpeg-minimal/build-macos.sh

      - name: 验收 macos-arm64（全量 fixture）
        run: |
          bash scripts/ffmpeg-minimal/verify.sh \
            --binary work/build/macos-arm64/ffmpeg \
            --platform macos-arm64 --archs arm64

      - name: 保存产物到缓存（供 universal / compare / release 使用）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/build/macos-arm64/ffmpeg
            work/build/macos-arm64/configure.cmd
            work/dist/ffmpeg-macos-arm64.zip
          key: xfer-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}

  macos-x64:
    name: macOS x86_64 minimal（Rosetta 验证）
    needs: validate
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 缓存 FFmpeg 源码
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dl
          key: ffmpeg-src-macos-x64-${{ inputs.ffmpeg_version }}

      - name: 缓存 ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-macos-x64-${{ inputs.ffmpeg_version }}-${{ hashFiles('scripts/ffmpeg-minimal/components.sh', 'scripts/ffmpeg-minimal/common.sh') }}
          restore-keys: |
            ccache-macos-x64-${{ inputs.ffmpeg_version }}-
            ccache-macos-

      - name: 安装 nasm / ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install nasm ccache

      - name: 构建 x86_64（交叉编译）
        env:
          BUILD_TARGET: x86_64
        run: bash scripts/ffmpeg-minimal/build-macos.sh

      - name: 安装 Rosetta
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true || { echo "Rosetta 不可用"; exit 1; }

      - name: 验收 macos-x64（Rosetta，快速冒烟）
        run: |
          arch -x86_64 bash scripts/ffmpeg-minimal/verify.sh \
            --binary work/build/macos-x86_64/ffmpeg \
            --platform macos-x64 --archs x86_64 --quick

      - name: 保存产物到缓存（供 universal / release 使用）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/build/macos-x86_64/ffmpeg
            work/build/macos-x86_64/configure.cmd
            work/dist/ffmpeg-macos-x64.zip
          key: xfer-macos-x64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}

  macos-universal:
    name: macOS universal（lipo）
    needs: [validate, macos-arm64, macos-x64]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 恢复 arm64 切片
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/build/macos-arm64/ffmpeg
            work/build/macos-arm64/configure.cmd
            work/dist/ffmpeg-macos-arm64.zip
          key: xfer-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 恢复 x86_64 切片
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/build/macos-x86_64/ffmpeg
            work/build/macos-x86_64/configure.cmd
            work/dist/ffmpeg-macos-x64.zip
          key: xfer-macos-x64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 缓存 FFmpeg 源码（LICENSE / BUILD.txt）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dl
          key: ffmpeg-src-macos-universal-${{ inputs.ffmpeg_version }}
          restore-keys: |
            ffmpeg-src-macos-

      - name: 恢复可执行权限（artifact 不保留文件模式）
        run: chmod +x work/build/macos-arm64/ffmpeg work/build/macos-x86_64/ffmpeg

      - name: lipo 合并 + 打包
        env:
          BUILD_TARGET: universal
        run: bash scripts/ffmpeg-minimal/build-macos.sh

      - name: 验收 macos-universal（快速冒烟）
        run: |
          bash scripts/ffmpeg-minimal/verify.sh \
            --binary work/build/macos-universal/ffmpeg \
            --platform macos-universal --archs arm64,x86_64 --quick

      - name: 保存 universal 产物到缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dist/ffmpeg-macos-universal.zip
          key: xfer-macos-universal-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}

  macos-reference:
    name: macOS arm64 reference（全量对照，不发布）
    needs: validate
    if: inputs.build_reference == true
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 缓存 FFmpeg 源码
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dl
          key: ffmpeg-src-macos-ref-${{ inputs.ffmpeg_version }}

      - name: 缓存参考构建产物（命中则跳过全量编译）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/build/ref-macos-arm64/ffmpeg
          key: ffmpeg-ref-macos-arm64-${{ inputs.ffmpeg_version }}-${{ hashFiles('scripts/ffmpeg-minimal/common.sh', '.github/workflows/build-ffmpeg-minimal.yml') }}

      - name: 缓存 ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-macos-ref-${{ inputs.ffmpeg_version }}-${{ hashFiles('scripts/ffmpeg-minimal/common.sh') }}
          restore-keys: |
            ccache-macos-ref-${{ inputs.ffmpeg_version }}-
            ccache-macos-

      - name: 安装 ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ccache

      - name: 构建参考版（缓存命中则跳过）
        env:
          BUILD_TARGET: reference
          REUSE_REFERENCE: "true"
        run: bash scripts/ffmpeg-minimal/build-macos.sh

      - name: 确认参考版可运行
        run: work/build/ref-macos-arm64/ffmpeg -hide_banner -version | head -n 1

      - name: 保存参考产物到缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/build/ref-macos-arm64/ffmpeg
          key: xfer-macos-ref-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}

  macos-compare:
    name: macOS PCM 一致性 + 解码耗时对比
    needs: [validate, macos-arm64, macos-reference]
    if: inputs.build_reference == true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 恢复 minimal 切片
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/build/macos-arm64/ffmpeg
            work/build/macos-arm64/configure.cmd
            work/dist/ffmpeg-macos-arm64.zip
          key: xfer-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 恢复参考产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/build/ref-macos-arm64/ffmpeg
          key: xfer-macos-ref-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 恢复可执行权限（缓存归档在部分文件系统上可能丢失模式）
        run: chmod +x work/build/macos-arm64/ffmpeg work/build/ref-macos-arm64/ffmpeg

      - name: 对比
        run: |
          bash scripts/ffmpeg-minimal/compare-pcm.sh \
            --minimal   work/build/macos-arm64/ffmpeg \
            --reference work/build/ref-macos-arm64/ffmpeg

  # ===========================================================================
  release:
    name: 发布 Release
    needs:
      - validate
      - win-minimal
      - win-reference
      - win-compare
      - macos-arm64
      - macos-x64
      - macos-universal
      - macos-reference
      - macos-compare
    if: >-
      inputs.publish_release == true &&
      !cancelled() &&
      needs.win-minimal.result == 'success' &&
      needs.macos-arm64.result == 'success' &&
      needs.macos-x64.result == 'success' &&
      needs.macos-universal.result == 'success' &&
      (inputs.build_reference == false ||
       (needs.win-compare.result == 'success' && needs.macos-compare.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 恢复 Windows 产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/dist/ffmpeg-win-x64.zip
            work/build/win-x64/ffmpeg.exe
          key: xfer-win-min-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 恢复 macOS arm64 产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/build/macos-arm64/ffmpeg
            work/build/macos-arm64/configure.cmd
            work/dist/ffmpeg-macos-arm64.zip
          key: xfer-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 恢复 macOS x86_64 产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/build/macos-x86_64/ffmpeg
            work/build/macos-x86_64/configure.cmd
            work/dist/ffmpeg-macos-x64.zip
          key: xfer-macos-x64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 恢复 macOS universal 产物
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/dist/ffmpeg-macos-universal.zip
          key: xfer-macos-universal-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ffmpeg_version }}
          fail-on-cache-miss: true

      - name: 生成 SHA256SUMS 与 Release 说明
        run: |
          bash scripts/ffmpeg-minimal/release-notes.sh work/dist "${{ inputs.release_tag }}"
          cat work/dist/SHA256SUMS.txt

      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file work/dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --title "FFmpeg minimal build (${{ inputs.ffmpeg_version }})" \
              --notes-file work/dist/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" work/dist/*.zip work/dist/SHA256SUMS.txt --clobber
